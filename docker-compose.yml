version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: careerpath-backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://careerpath:careerpath_secret@db:5432/careerpath_db
      - REDIS_URL=redis://redis:6379/0
      - OPENAI_API_KEY=${OPENAI_API_KEY}
    depends_on:
      - db
      - redis
    volumes:
      - ./backend:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: careerpath-frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: npm run dev

  db:
    image: postgres:15-alpine
    container_name: careerpath-postgres
    environment:
      POSTGRES_USER: careerpath
      POSTGRES_PASSWORD: careerpath_secret
      POSTGRES_DB: careerpath_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: careerpath-redis
    ports:
      - "6379:6379"

volumes:
  postgres_data:
